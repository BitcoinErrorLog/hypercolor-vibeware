services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vibeware
      POSTGRES_PASSWORD: vibeware
      POSTGRES_DB: vibeware
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeware -d vibeware"]
      interval: 5s
      timeout: 5s
      retries: 10
